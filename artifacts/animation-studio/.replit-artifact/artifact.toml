kind = "web"
previewPath = "/"
title = "2D Animation Studio"
version = "1.0.0"
id = "artifacts/animation-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20125

[services.development]
run = "pnpm --filter @workspace/animation-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/animation-studio", "run", "build" ]
publicDir = "artifacts/animation-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20125"
BASE_PATH = "/"
